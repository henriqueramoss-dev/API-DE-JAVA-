name: Teste Biblioteca API

on:
  push:
    branches:
      - develop
    paths:
      - "biblioteca-api/**"
      - ".github/workflows/test-biblioteca.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: biblioteca-api

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar e testar
        run: mvn -B clean test

      - name: Gerar aplicacao
        run: mvn -B package -DskipTests

      - name: Iniciar API
        run: |
          java -jar target/*.jar > app.log 2>&1 &
          echo $! > app.pid

      - name: Verificar inicializacao e Swagger
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/v3/api-docs > openapi.json; then
              echo "API iniciada e OpenAPI disponivel."
              break
            fi
            sleep 2
          done

          curl -fsS http://localhost:8080/usuarios?page=0\&size=10 > usuarios.json
          echo "Endpoint GET /usuarios respondeu com sucesso."

      - name: Smoke test de livros com relacionamentos
        run: |
          curl -fsS -X POST http://localhost:8080/categorias \
            -H "Content-Type: application/json" \
            -d '{"nome":"Romance"}' > categoria.json

          curl -fsS -X POST http://localhost:8080/autores \
            -H "Content-Type: application/json" \
            -d '{"nome":"Machado de Assis"}' > autor.json

          curl -fsS -X POST http://localhost:8080/livros \
            -H "Content-Type: application/json" \
            -d '{"titulo":"Dom Casmurro","isbn":"9788535910663","anoPublicacao":1899,"categoriaId":1,"autoresIds":[1]}' > livro.json

          curl -fsS "http://localhost:8080/livros?page=0&size=10" > livros.json
          grep -q "Dom Casmurro" livros.json
          echo "Endpoint GET /livros respondeu com os relacionamentos corretamente."

      - name: Smoke test de emprestimos
        run: |
          set -e
          req() {
            NAME="$1"; EXPECTED="$2"; shift 2
            STATUS=$(curl -sS -o resposta.json -w "%{http_code}" "$@")
            echo "$NAME -> HTTP $STATUS"
            cat resposta.json || true
            echo
            if [ "$STATUS" != "$EXPECTED" ]; then
              echo "Falha em: $NAME. Esperado $EXPECTED, recebido $STATUS"
              echo "===== app.log ====="
              cat app.log || true
              exit 1
            fi
          }

          req "POST usuario" "201" -X POST http://localhost:8080/usuarios \
            -H "Content-Type: application/json" \
            -d '{"id":99,"nome":"Usuario Emprestimo","email":"emprestimo@teste.local"}'
          USUARIO_ID=$(jq -r '.id' resposta.json)

          req "POST categoria" "201" -X POST http://localhost:8080/categorias \
            -H "Content-Type: application/json" \
            -d '{"nome":"Categoria Emprestimo"}'
          CATEGORIA_ID=$(jq -r '.id' resposta.json)

          req "POST autor" "201" -X POST http://localhost:8080/autores \
            -H "Content-Type: application/json" \
            -d '{"nome":"Autor Emprestimo"}'
          AUTOR_ID=$(jq -r '.id' resposta.json)

          req "POST livro" "201" -X POST http://localhost:8080/livros \
            -H "Content-Type: application/json" \
            -d "{\"titulo\":\"Livro Emprestimo\",\"isbn\":\"EMP-001\",\"anoPublicacao\":2026,\"categoriaId\":$CATEGORIA_ID,\"autoresIds\":[$AUTOR_ID]}"
          LIVRO_ID=$(jq -r '.id' resposta.json)

          req "POST emprestimo" "201" -X POST http://localhost:8080/emprestimos \
            -H "Content-Type: application/json" \
            -d "{\"dataEmprestimo\":\"2026-10-06\",\"dataPrevistaDevolucao\":\"2026-10-25\",\"status\":\"ATIVO\",\"usuarioId\":$USUARIO_ID,\"livroId\":$LIVRO_ID}"
          EMPRESTIMO_ID=$(jq -r '.id' resposta.json)

          req "GET emprestimos" "200" "http://localhost:8080/emprestimos?page=0&size=10"
          req "GET emprestimo por ID" "200" "http://localhost:8080/emprestimos/$EMPRESTIMO_ID"
          req "GET emprestimos por status" "200" "http://localhost:8080/emprestimos/buscar?status=ATIVO&page=0&size=10"

          req "PUT emprestimo" "200" -X PUT "http://localhost:8080/emprestimos/$EMPRESTIMO_ID" \
            -H "Content-Type: application/json" \
            -d "{\"dataEmprestimo\":\"2026-10-06\",\"dataPrevistaDevolucao\":\"2026-10-25\",\"status\":\"DEVOLVIDO\",\"usuarioId\":$USUARIO_ID,\"livroId\":$LIVRO_ID}"

          grep -q "DEVOLVIDO" resposta.json
          echo "Fluxo de empréstimos concluído com sucesso."

      - name: Encerrar API
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi
