name: Teste Biblioteca API

on:
  push:
    branches:
      - develop
    paths:
      - "biblioteca-api/**"
      - ".github/workflows/test-biblioteca.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: biblioteca-api

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar e testar
        run: mvn -B clean test

      - name: Gerar aplicacao
        run: mvn -B package -DskipTests

      - name: Iniciar API
        run: |
          java -jar target/*.jar > app.log 2>&1 &
          echo $! > app.pid

      - name: Verificar inicializacao e Swagger
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/v3/api-docs > openapi.json; then
              echo "API iniciada e OpenAPI disponivel."
              break
            fi
            sleep 2
          done

          curl -fsS http://localhost:8080/usuarios?page=0\&size=10 > usuarios.json
          echo "Endpoint GET /usuarios respondeu com sucesso."

      - name: Smoke test de livros com relacionamentos
        run: |
          curl -fsS -X POST http://localhost:8080/categorias \
            -H "Content-Type: application/json" \
            -d '{"nome":"Romance"}' > categoria.json

          curl -fsS -X POST http://localhost:8080/autores \
            -H "Content-Type: application/json" \
            -d '{"nome":"Machado de Assis"}' > autor.json

          curl -fsS -X POST http://localhost:8080/livros \
            -H "Content-Type: application/json" \
            -d '{"titulo":"Dom Casmurro","isbn":"9788535910663","anoPublicacao":1899,"categoria":{"id":1},"autores":[{"id":1}]}' > livro.json

          curl -fsS "http://localhost:8080/livros?page=0&size=10" > livros.json
          grep -q "Dom Casmurro" livros.json
          echo "Endpoint GET /livros respondeu com os relacionamentos corretamente."

      - name: Smoke test de emprestimos
        run: |
          STATUS_USUARIO=$(curl -sS -o usuario-emprestimo.json -w "%{http_code}" -X POST http://localhost:8080/usuarios \
            -H "Content-Type: application/json" \
            -d '{"id":99,"nome":"Usuario Emprestimo","email":"emprestimo@teste.local"}')
          test "$STATUS_USUARIO" = "201"
          grep -q '"id":1' usuario-emprestimo.json
          echo "POST /usuarios retornou 201 e ignorou o ID enviado pelo cliente."

          curl -fsS -X POST http://localhost:8080/categorias \
            -H "Content-Type: application/json" \
            -d '{"nome":"Categoria Emprestimo"}' > categoria-emprestimo.json

          curl -fsS -X POST http://localhost:8080/autores \
            -H "Content-Type: application/json" \
            -d '{"nome":"Autor Emprestimo"}' > autor-emprestimo.json

          curl -fsS -X POST http://localhost:8080/livros \
            -H "Content-Type: application/json" \
            -d '{"titulo":"Livro Emprestimo","isbn":"EMP-001","anoPublicacao":2026,"categoria":{"id":2},"autores":[{"id":2}]}' > livro-emprestimo.json

          curl -fsS -X POST http://localhost:8080/emprestimos \
            -H "Content-Type: application/json" \
            -d '{"dataEmprestimo":"2026-10-06","dataPrevistaDevolucao":"2026-10-25","status":"ATIVO","usuario":{"id":1},"livro":{"id":2}}' > emprestimo.json

          curl -fsS "http://localhost:8080/emprestimos?page=0&size=10" > emprestimos.json

          curl -fsS -X PUT http://localhost:8080/emprestimos/1 \
            -H "Content-Type: application/json" \
            -d '{"dataEmprestimo":"2026-10-06","dataPrevistaDevolucao":"2026-10-25","status":"DEVOLVIDO","usuario":{"id":1},"livro":{"id":2}}' > emprestimo-atualizado.json

          grep -q "DEVOLVIDO" emprestimo-atualizado.json
          echo "CRUD principal de emprestimos respondeu com sucesso."

      - name: Encerrar API
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi
